server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Next static export with trailingSlash emits route/index.html. This keeps
  # clean URLs working while returning a real 404 for missing files.
  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
